<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jota — Grupo Free</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap');
        
          :root{
            --void:#05080D;
            --glass-bg:rgba(28,30,34,0.10);
            --glass-border:rgba(255,255,255,0.16);
            --gold:#FFC72C;
            --green:#8CFF3D;
            --green-2:#4fe61a;
            --ink:#F5F7FB;
            --muted:#9AA3B5;
            --line:rgba(255,255,255,0.08);
          }
        
          *{margin:0;padding:0;box-sizing:border-box;}
        
          html,body{
            background:var(--void);
            color:var(--ink);
            font-family:'Manrope',sans-serif;
            min-height:100%;
            overflow-x:hidden;
          }
        
          body{
            position:relative;
            display:flex;
            flex-direction:column;
            align-items:center;
          }
        
          /* full-bleed hero image, edge to edge, starts at the very top */
          .hero-full{
            position:relative;
            width:100%;
            height:min(46vh, 400px);
            overflow:hidden;
            line-height:0;
          }
          .hero-full img{
            display:block;
            width:100%;
            height:100%;
            object-fit:cover;
            object-position:center 18%;
          }
          .hero-fade{
            position:absolute;
            inset:0;
            background:linear-gradient(to bottom,
              rgba(5,8,13,0) 35%,
              rgba(5,8,13,0.6) 68%,
              rgba(5,8,13,0.94) 88%,
              var(--void) 100%);
            pointer-events:none;
          }
        
.content{
    width:100%;
    max-width:460px;
    padding:0 20px 56px;
    margin-top:-4vw;  /* era -8vw — deixei menos negativo pra descer a caixa */
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
    z-index:1;
}
        
          /* glassmorphism content panel */
          .content-panel{
            width:100%;
            background:var(--glass-bg);
            -webkit-backdrop-filter:blur(32px) saturate(170%);
            backdrop-filter:blur(32px) saturate(170%);
            border:1px solid var(--glass-border);
            border-radius:22px;
            padding:28px 24px 30px;
            box-shadow:0 24px 50px -24px rgba(0,0,0,0.7);
            animation:floatY 5.5s ease-in-out infinite;
          }
          @keyframes floatY{
            0%,100%{ transform:translateY(0); }
            50%{ transform:translateY(-6px); }
          }
        
          .headline{
            font-family:'Anton',sans-serif;
            font-weight:400;
            font-size:clamp(22px,6vw,27px);
            line-height:1.15;
            max-width:340px;
            margin:0 auto;
            background:linear-gradient(100deg, var(--ink) 30%, var(--green) 45%, var(--ink) 60%);
            background-size:250% 100%;
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            animation:shimmer 4.5s linear infinite;
          }
          @keyframes shimmer{
            0%{ background-position:120% 0; }
            100%{ background-position:-20% 0; }
          }
        
          .sub{
            margin-top:14px;
            font-size:15px;
            line-height:1.6;
            color:var(--muted);
            max-width:330px;
            margin-left:auto;
            margin-right:auto;
          }
          .sub b{color:var(--ink); font-weight:700;}
        
          .cta{
            margin-top:26px;
            display:inline-flex;
            align-items:center;
            gap:10px;
            padding:17px 54px;
            border-radius:14px;
            background:linear-gradient(135deg, var(--green) 0%, var(--green-2) 100%);
            color:#07220a;
            font-weight:800;
            font-size:15px;
            letter-spacing:.03em;
            text-decoration:none;
            text-transform:uppercase;
            box-shadow:0 16px 34px -12px rgba(140,255,61,0.45);
            transition:transform .18s ease, box-shadow .18s ease;
          }
          .cta:hover{
            transform:translateY(-2px);
            box-shadow:0 20px 40px -12px rgba(140,255,61,0.6);
          }
          .cta svg{width:18px;height:18px;flex-shrink:0;}
        
          .microcopy{
            margin-top:14px;
            font-size:12px;
            color:var(--muted);
            letter-spacing:.02em;
          }
        
          .divider{
            width:100%;
            max-width:300px;
            height:1px;
            background:linear-gradient(90deg, transparent, var(--line), transparent);
            margin:36px 0 26px;
          }
        
          .badge18{
            height:34px;
            width:auto;
            opacity:.95;
          }
        
          .copyright{
            margin-top:16px;
            font-size:11px;
            color:#5b6478;
          }
        
          /* floating decorative elements: ball + trophy */
         .floaters{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
}
.floaters .emoji-ball{
    position:absolute;
    opacity:0.55;
    font-size:54px;
    line-height:1;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));
}
.f-ball-1{ font-size:52px; top:14%; left:8%; animation:drift1 4.5s ease-in-out infinite; }
.f-ball-2{ font-size:34px; top:60%; right:10%; animation:drift2 3.8s ease-in-out infinite; }
.f-cup-1{ font-size:58px; top:34%; right:6%; animation:drift3 5s ease-in-out infinite; }
.f-ball-3{ font-size:30px; top:82%; left:14%; animation:drift2 4.2s ease-in-out infinite reverse; }

@keyframes drift1{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(36px,-28px) rotate(35deg); }
}
@keyframes drift2{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(-20px,52px) rotate(8deg); }
}
@keyframes drift3{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(-14px,-26px) rotate(16deg); }
}
        
          .content, .hero-full{ position:relative; z-index:1; }
        
          @media (prefers-reduced-motion: reduce){
            .content-panel{ animation:none; }
            .headline{ animation:none; background-position:0 0; }
            .f-ball-1,.f-ball-2,.f-cup-1,.f-ball-3{ animation:none; }
          }
    </style>
