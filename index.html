<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Elimina o scroll */
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lp-container {
            width: 100%;
            max-width: 450px;
            height: 100dvh; /* Altura exata da tela */
            position: relative;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.95) 75%), url('jp-direto.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribui conteúdo e selo */
            align-items: center;
            padding: 20px 0 0 0; /* Tiramos o padding das laterais pro selo colar na borda */
            text-align: center;
        }

        /* CONTAINER DO CONTEÚDO PRINCIPAL DENTRO DA TELA */
        .content-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            padding: 0 15px;
            margin-top: auto; /* Empurra o conteúdo pra baixo perto do selo */
            margin-bottom: 12px;
        }

        .headline-container {
            background-color: #ff0000; /* Vermelho Puro */
            padding: 12px 10px;
            border-radius: 6px;
        }

        .headline-text {
            color: #ffffff !important;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .description {
            background-color: #ffffff;
            color: #000000 !important;
            font-size: 14px;
            font-weight: bold;
            padding: 10px 12px;
            line-height: 1.3;
            border-radius: 8px;
        }

        .btn-entrar {
            background-color: #ff0000;
            color: #fff !important;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 16px;
            border-radius: 12px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            transition: 0.3s;
            display: block;
            animation: pulse 1.5s infinite;
        }

        .btn-entrar:active { 
            transform: scale(0.95); 
        }

        /* ANIMAÇÃO DE PULSO NO BOTÃO */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 12px rgba(255,0,0,0); }
            100% { transform: scale(1); }
        }

        .social-proof {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 20px;
        }

        .avatars { display: flex; }
        
        .avatars img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #fff;
            margin-left: -10px;
        }
        
        .avatars img:first-child { margin-left: 0; }
        
        .proof-text { 
            font-size: 12px; 
            color: #eee; 
            font-weight: bold; 
        }

        /* SELO POR EXTENSO NO RODAPÉ */
        .stamp-bottom {
            width: 100%;
            display: block;
            height: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="lp-container">
        
        <!-- CONTEÚDO PRINCIPAL -->
        <div class="content-box">
            <div class="headline-container">
                <h1 class="headline-text">ACESSO LIBERADO A MINHA<br>COMUNIDADE GRATUITA</h1>
            </div>

            <p class="description">
                Entre agora na comunidade que mais entrega Odds altas, análises, organização e responsabilidade.
            </p>

            <a href="https://wa.me/5575936180638?text=Vim+pelo+site" class="btn-entrar" onclick="trackClick()">ENTRAR AGORA</a>

            <div class="social-proof">
                <div class="avatars">
                    <img src="https://i.pravatar.cc/100?u=11" alt="Membro">
                    <img src="https://i.pravatar.cc/100?u=12" alt="Membro">
                    <img src="https://i.pravatar.cc/100?u=13" alt="Membro">
                    <img src="https://i.pravatar.cc/100?u=14" alt="Membro">
                </div>
                <span class="proof-text">Pessoas reais com resultados reais</span>
            </div>
        </div>

        <!-- SELO EXTENSO NO FIM DA LP -->
        <img src="BATEUBET.png" alt="Selo Bateubet / Ministério da Fazenda" class="stamp-bottom">

    </div>

    <script>
    function trackClick() {
        // Dispara Lead para todos os Pixels iniciados no topo
        fbq('track', 'Lead');
        console.log("Lead disparado!");
    }
    </script>

</body>
</html>
